name: Build Android APK (Parya Rubika Music Bot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Copy bot core into mobile_apk
        run: |
          cp bot/rubika_music_bot.py mobile_apk/rubika_music_bot.py

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: mobile_apk/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('mobile_apk/buildozer.spec') }}

      - name: Build Android APK with Buildozer
        working-directory: mobile_apk
        run: |
          pip install --upgrade pip buildozer cython==0.29.36
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParyaRubikaMusicBot-APK
          path: mobile_apk/bin/*.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile_apk/bin/*.apk
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
